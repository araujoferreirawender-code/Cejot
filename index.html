<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17110d"><title>Veredito — Tribunal Animado</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,textarea{font:inherit}main{max-width:900px;margin:auto;padding:12px}.court{background:radial-gradient(circle at 50% 5%,#714826 0,#3d2415 48%,#14100d 100%);border:1px solid #6f4a29;border-radius:24px;padding:14px;overflow:hidden;position:relative}.court:after{content:'⚖️';position:absolute;right:-15px;top:70px;font-size:170px;opacity:.04;pointer-events:none}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.logo{font-size:24px;font-weight:950;letter-spacing:1px}.phase{background:#111c;border:1px solid #ffffff22;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900}.room{text-align:center;color:#e7d3ad;font-size:12px;margin:8px 0}.scene{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;min-height:310px}.person{text-align:center;position:relative}.char{transition:transform .3s}.person.active .char{animation:talk .8s infinite alternate}.judge.thinking .char{animation:think 1.1s infinite}.judge.judged .char{animation:judge .9s ease 2}.head{width:72px;height:72px;border:4px solid #17110d;border-radius:45%;display:flex;align-items:center;justify-content:center;font-size:38px;margin:auto;box-shadow:0 7px 0 #0007}.a .head{background:#7b4b31}.b .head{background:#d59c69}.judge .head{background:#b87547}.body{width:104px;height:96px;border:3px solid #27160b;border-radius:26px 26px 8px 8px;margin:auto}.a .body{background:#22272e}.b .body{background:#ececec}.judge .body{background:#25272d}.desk{height:56px;max-width:180px;margin:-3px auto 0;border:3px solid #30170a;border-radius:10px 10px 3px 3px;background:linear-gradient(#9b602e,#512d17);display:flex;align-items:center;justify-content:center}.gavel{font-size:28px;animation:hit 2.8s infinite}.name{display:inline-block;background:#0e0e0e;padding:6px 10px;border-radius:9px;margin-top:7px;font-weight:900;font-size:12px}@keyframes talk{to{transform:translateY(-6px) rotate(1deg)}}@keyframes think{50%{transform:translateY(-8px) rotate(-3deg)}}@keyframes judge{50%{transform:translateY(-12px) rotate(3deg)}}@keyframes hit{0%,80%{transform:rotate(0)}86%{transform:rotate(-23deg)}92%{transform:rotate(16deg)}100%{transform:rotate(0)}}
.audience{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;background:#090706aa;border-radius:14px;padding:8px;font-size:23px}.audience span{display:inline-block;animation:aud .9s infinite alternate ease-in-out}.audience span:nth-child(2n){animation-delay:.25s}.audience span:nth-child(3n){animation-delay:.5s}@keyframes aud{to{transform:translateY(-3px)}}.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:12px 0}.step{text-align:center;font-size:10px;color:#a9a29a}.dot{height:8px;background:#ffffff1c;border-radius:8px;margin-bottom:5px}.step.done .dot,.step.current .dot{background:#d9ad54}.step.current{color:#d9ad54;font-weight:900}.panels{display:grid;grid-template-columns:1fr 1fr;gap:10px}.panel{background:#0d1219e8;border:1px solid #ffffff18;border-radius:15px;padding:12px}.panel h3{margin:0 0 5px;font-size:14px}.panel p{margin:4px 0;color:#aeb6c3;font-size:12px}.field{width:100%;margin-top:7px;border:1px solid #334155;background:#0a1018;color:#fff;border-radius:10px;padding:10px;outline:none}.field:focus{border-color:#d9ad54}textarea{min-height:92px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.btn{min-height:44px;border:0;border-radius:11px;padding:10px 14px;font-weight:900;cursor:pointer;background:#d9ad54;color:#24190f}.btn.alt{background:#18202b;color:#fff;border:1px solid #334155}.status{margin-top:10px;padding:12px;border-radius:12px;background:#05050588;text-align:center;font-weight:800}.result{margin-top:10px}.verdict{padding:20px;border-radius:17px;background:linear-gradient(135deg,#382712,#151515);text-align:center;font-size:22px;font-weight:950;animation:pop .6s cubic-bezier(.2,1.35,.5,1)}.sub{font-size:13px;color:#b9b5ad;font-weight:500;margin-top:8px}.stamp{display:inline-block;margin-top:10px;border:3px solid #d9ad54;color:#d9ad54;padding:5px 11px;border-radius:8px;transform:rotate(-3deg);font-size:12px}.small{font-size:11px!important}@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}@media(max-width:650px){main{padding:8px}.scene{grid-template-columns:1fr 1fr;min-height:290px}.judge{grid-column:1/-1;order:-1}.panels{grid-template-columns:1fr}.body{width:84px;height:76px}.head{width:62px;height:62px;font-size:34px}}
</style>
</head>
<body><main><section class="court" id="game">
<div class="top"><div class="logo">⚖️ VEREDITO</div><div class="phase" id="phase">TRIBUNAL ABERTO</div></div>
<div class="room">SALA 482731 • 👥 3/3 JOGADORES</div>
<div class="scene">
<div class="person a" id="Achar"><div class="char"><div class="head">😤</div><div class="body"></div></div><div class="desk"></div><div class="name">PESSOA A</div></div>
<div class="person judge" id="Jchar"><div class="char"><div class="head">🧐</div><div class="body"></div></div><div class="desk"><div class="gavel">🔨</div></div><div class="name">JUIZ</div></div>
<div class="person b" id="Bchar"><div class="char"><div class="head">😎</div><div class="body"></div></div><div class="desk"></div><div class="name">PESSOA B</div></div>
</div>
<div class="audience"><span>👨‍⚖️</span><span>🐸</span><span>👵</span><span>🧑‍🎤</span><span>🐱</span><span>🤓</span><span>👮</span><span>🐵</span><span>🥸</span><span>🧑‍🍳</span></div>
<div class="timeline" id="timeline"><div class="step current"><div class="dot"></div>ABERTURA</div><div class="step"><div class="dot"></div>RELATOS</div><div class="step"><div class="dot"></div>EVIDÊNCIAS</div><div class="step"><div class="dot"></div>ANÁLISE</div><div class="step"><div class="dot"></div>VEREDITO</div></div>
<div class="panels">
<div class="panel"><h3>📝 Pessoa A</h3><textarea class="field" id="a" placeholder="Conte o que aconteceu..."></textarea><input class="field" id="ae" placeholder="📎 Evidência opcional"></div>
<div class="panel"><h3>📝 Pessoa B</h3><textarea class="field" id="b" placeholder="Conte o seu lado..."></textarea><input class="field" id="be" placeholder="📎 Evidência opcional"></div>
</div>
<div class="panel" style="margin-top:10px"><h3>💬 Tribunal</h3><p id="chat">Juiz: Todos de pé! O tribunal está oficialmente aberto.</p><div class="actions"><button class="btn" id="start">⚖️ Começar julgamento</button><button class="btn alt" id="demo">🎲 Preencher caso</button><button class="btn alt" id="reset">🔄 Novo caso</button></div><div class="status" id="status">Aguardando os relatos das duas pessoas.</div></div>
<div class="result" id="result" aria-live="polite"></div>
</section></main>
<script>
(()=>{const q=s=>document.querySelector(s),A=q('#a'),B=q('#b'),AE=q('#ae'),BE=q('#be'),chat=q('#chat'),status=q('#status'),phase=q('#phase'),result=q('#result'),ca=q('#Achar'),cb=q('#Bchar'),cj=q('#Jchar'),steps=[...document.querySelectorAll('.step')];let t;
function stage(n,label,msg){steps.forEach((s,i)=>{s.classList.toggle('current',i===n);s.classList.toggle('done',i<n)});phase.textContent=label;chat.textContent=msg;status.textContent=msg}
q('#demo').onclick=()=>{A.value='Ele pegou minha última coxinha sem pedir e disse que ia devolver.';B.value='Eu achei que era comunitária e ainda deixei o molho.';AE.value='Mensagem no grupo';BE.value='Testemunha no local';result.innerHTML='';ca.classList.add('active');cb.classList.add('active');stage(1,'RELATOS','Juiz: Os dois relatos foram registrados. Vamos conferir as evidências.');setTimeout(()=>{ca.classList.remove('active');cb.classList.remove('active')},1700)};
q('#start').onclick=()=>{if(!A.value.trim()||!B.value.trim()){stage(0,'AGUARDANDO RELATOS','Juiz: Preciso ouvir as duas pessoas antes de começar.');return}clearTimeout(t);result.innerHTML='';cj.classList.add('thinking');stage(1,'RELATOS','Juiz: Os dois lados foram ouvidos.');t=setTimeout(()=>{stage(2,'EVIDÊNCIAS','Juiz: Agora vou conferir as evidências.');t=setTimeout(()=>{stage(3,'ANÁLISE','Juiz: Silêncio no tribunal! Estou analisando o caso.');t=setTimeout(()=>{const sa=A.value.trim().length+(AE.value.trim()?45:0),sb=B.value.trim().length+(BE.value.trim()?45:0);let title,sub;if(Math.abs(sa-sb)<20){title='🤝 CASO INCONCLUSIVO';sub='As duas versões ficaram muito próximas nesta partida.'}else if(sa>sb){title='🧑‍⚖️ PESSOA A';sub='O lado A apresentou mais informações e evidências na partida.'}else{title='🧑‍⚖️ PESSOA B';sub='O lado B apresentou mais informações e evidências na partida.'}cj.classList.remove('thinking');cj.classList.add('judged');stage(4,'VEREDITO','Juiz: Depois de analisar tudo, chegou a hora do veredito!');result.innerHTML='<div class="verdict">'+title+'<div class="sub">'+sub+'</div><div class="stamp">🔨 VEREDITO DA PARTIDA</div><div class="small" style="color:#a9a29a;margin-top:9px">Resultado apenas como mecânica do jogo — não é uma decisão jurídica real.</div></div>'},1000)},850)},750)};
q('#reset').onclick=()=>{clearTimeout(t);A.value=B.value=AE.value=BE.value='';result.innerHTML='';ca.classList.remove('active');cb.classList.remove('active');cj.classList.remove('thinking','judged');stage(0,'TRIBUNAL ABERTO','Juiz: Todos de pé! O tribunal está oficialmente aberto.')};
})();
</script></body></html>
